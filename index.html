<style>

        text-shadow:
            0 0 5px #fff,

        text-shadow:
            0 0 8px #fff,
            0 0 25px rgba(255,255,255,0.9),
            0 0 55px rgba(255,255,255,0.6),
            0 0 90px rgba(255,255,255,0.25);
    }

</head>

<body>

<canvas id="web"></canvas>

<div class="content">
    <h1>DOWN FOR MAINTENANCE</h1>
    <div class="subtitle">Use the official link to access the website:</div>
    <div class="subtitle">https://thisissonobodyplaysgame.github.io/galac/</div>
</div>

<script>
const canvas = document.getElementById("web");
const ctx = canvas.getContext("2d");

let width, height;
let particles = [];
const mouse = {
    x: -1000,
    y: -1000,
    radius: 180
};

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    const count = Math.min(
        160,
        Math.max(65, Math.floor(width * height / 8500))
    );

    particles = [];

    for (let i = 0; i < count; i++) {
        particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.35,
            vy: (Math.random() - 0.5) * 0.35,
            size: Math.random() * 1.5 + 0.5
        });
    }
}

window.addEventListener("resize", resize);

window.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener("touchmove", e => {
    if (e.touches.length) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
    }
}, { passive: true });

window.addEventListener("mouseout", e => {
    if (!e.relatedTarget) {
        mouse.x = -1000;
        mouse.y = -1000;
    }
});

function animate() {
    ctx.clearRect(0, 0, width, height);

    const maxDistance = 145;

    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < mouse.radius && distance > 0) {
            const force = (mouse.radius - distance) / mouse.radius;
            p.x -= dx / distance * force * 1.8;
            p.y -= dy / distance * force * 1.8;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
            const q = particles[j];
            const lineX = p.x - q.x;
            const lineY = p.y - q.y;
            const lineDistance = Math.sqrt(
                lineX * lineX + lineY * lineY
            );

            if (lineDistance < maxDistance) {
                const opacity = (1 - lineDistance / maxDistance) * 0.38;

                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(q.x, q.y);
                ctx.strokeStyle = `rgba(255,255,255,${opacity})`;
                ctx.lineWidth = 0.7;
                ctx.stroke();
            }
        }
    }

    // Extra web strands around the mouse
    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < mouse.radius) {
            const opacity = (1 - distance / mouse.radius) * 0.65;

            ctx.beginPath();
            ctx.moveTo(mouse.x, mouse.y);
            ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = `rgba(255,255,255,${opacity})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
        }
    }

    requestAnimationFrame(animate);
}

resize();
animate();
</script>

</body>
</html>
