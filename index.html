<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECHANIC</title>
    <link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2218%22%20fill%3D%22%230a0a0d%22%2F%3E%3Cg%20fill%3D%22%23ffffff%22%3E%3Crect%20x%3D%2246%22%20y%3D%225%22%20width%3D%228%22%20height%3D%2218%22%2F%3E%3Crect%20x%3D%2246%22%20y%3D%225%22%20width%3D%228%22%20height%3D%2218%22%20transform%3D%22rotate(45%2050%2050)%22%2F%3E%3Crect%20x%3D%2246%22%20y%3D%225%22%20width%3D%228%22%20height%3D%2218%22%20transform%3D%22rotate(90%2050%2050)%22%2F%3E%3Crect%20x%3D%2246%22%20y%3D%225%22%20width%3D%228%22%20height%3D%2218%22%20transform%3D%22rotate(135%2050%2050)%22%2F%3E%3Crect%20x%3D%2246%22%20y%3D%225%22%20width%3D%228%22%20height%3D%2218%22%20transform%3D%22rotate(180%2050%2050)%22%2F%3E%3Crect%20x%3D%2246%22%20y%3D%225%22%20width%3D%228%22%20height%3D%2218%22%20transform%3D%22rotate(225%2050%2050)%22%2F%3E%3Crect%20x%3D%2246%22%20y%3D%225%22%20width%3D%228%22%20height%3D%2218%22%20transform%3D%22rotate(270%2050%2050)%22%2F%3E%3Crect%20x%3D%2246%22%20y%3D%225%22%20width%3D%228%22%20height%3D%2218%22%20transform%3D%22rotate(315%2050%2050)%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2230%22%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2213%22%20fill%3D%22%230a0a0d%22%2F%3E%3C%2Fsvg%3E">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@arcade-v/arcade_v/navigation/style.css">

    <style>
:root {
            --bg0: #0a0a0d;
            --bg1: #0f0f14;
            --panel: #121217;
            --panel2: #18181f;
            --ink: #ffffff;
            --muted: #b8b8c6;
            --faint: #6a6a7c;
            --line: rgba(255, 255, 255, 0.14);
            --line-strong: rgba(255, 255, 255, 0.3);
            --hard: rgba(0, 0, 0, 0.55);
            --font-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
            --font-mono: 'Space Mono', 'Cascadia Mono', Consolas, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: var(--font-display);
            background:
                radial-gradient(ellipse 120% 80% at 50% -20%, rgba(255, 255, 255, 0.05), transparent 60%),
                var(--bg0);
            background-color: var(--bg0);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            letter-spacing: 0.2px;
        }

        ::selection { background: #fff; color: #0a0a0d; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg0); }
        ::-webkit-scrollbar-thumb { background: #26262e; border: 2px solid var(--bg0); }
        ::-webkit-scrollbar-thumb:hover { background: #fff; }

        :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

        /* ===== Background: interactive web canvas ===== */
        #webBkg {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
            display: block;
        }
        /* legacy starfield / nebula layers are no longer used */
        .stars, .stars2, .stars3, .nebula { display: none !important; }

        /* ===== Background themes (settings compat; monochrome) ===== */
        body.theme-deep { background-color: #0a0a0d; }
        body.theme-aurora { background-color: #0b0f14; background-image: radial-gradient(ellipse 120% 80% at 50% -20%, rgba(255,255,255,0.04), transparent 60%); }
        body.theme-flare { background-color: #140f0e; background-image: radial-gradient(ellipse 120% 80% at 50% -20%, rgba(255,255,255,0.03), transparent 60%); }
        body.theme-candy { background-color: #100f16; background-image: radial-gradient(ellipse 120% 80% at 50% -20%, rgba(255,255,255,0.04), transparent 60%); }
        body.theme-vortex { background-color: #0e0d1a; background-image: radial-gradient(ellipse 120% 80% at 50% -20%, rgba(255,255,255,0.04), transparent 60%); }
        body.theme-emerald { background-color: #0a0f0d; background-image: radial-gradient(ellipse 120% 80% at 50% -20%, rgba(255,255,255,0.03), transparent 60%); }

        /* ===== Left edge drawer (slide-out) ===== */
        .edge-hot { position: fixed; top: 0; left: 0; width: 20px; height: 100%; z-index: 300; pointer-events: auto; }
        .drawer {
            position: fixed; top: 0; left: 0;
            height: 100%; height: 100dvh; width: 252px;
            z-index: 400;
            display: flex; flex-direction: column;
            background: rgba(10, 10, 13, 0.96);
            border-right: 1px solid var(--line-strong);
            transform: translateX(-106%);
            transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: none;
        }
        .edge-hot:hover + .drawer, .drawer:hover, .drawer.open { transform: none; box-shadow: 24px 0 60px rgba(0, 0, 0, 0.6); }

        .drawer-head { display: flex; align-items: center; gap: 12px; padding: 20px 16px 16px; border-bottom: 1px dashed var(--line-strong); }
        .drawer-mark {
            width: 40px; height: 40px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: #0a0a0d; font-size: 16px;
            background: #fff; box-shadow: 4px 4px 0 var(--hard);
        }
        .drawer-title { font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; letter-spacing: 0.16em; line-height: 1.05; color: #fff; }
        .drawer-sub { font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.24em; color: var(--muted); margin-top: 3px; }

        .drawer nav { display: flex; flex-direction: column; gap: 6px; padding: 14px 12px; flex: 1; overflow-y: auto; }
        .drawer nav a {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 13px;
            color: var(--muted);
            text-decoration: none; cursor: pointer;
            font-family: var(--font-display); font-size: 0.95rem; font-weight: 500;
            letter-spacing: 0.06em;
            border: 1px solid transparent;
            transition: all 0.18s ease;
        }
        .drawer nav a i { width: 22px; text-align: center; color: var(--faint); font-size: 0.95rem; transition: all 0.18s ease; }
        .drawer nav a span { letter-spacing: 0.14em; }
        .drawer nav a:hover { color: #fff; background: rgba(255, 255, 255, 0.06); border-color: var(--line); }
        .drawer nav a:hover i { color: #fff; transform: translateX(2px); }
        .drawer nav a.active { color: #0a0a0d; background: #fff; border-color: #fff; box-shadow: 0 3px 0 var(--hard); }
        .drawer nav a.active i { color: inherit; }

        .drawer-foot { padding: 14px 16px; border-top: 1px dashed var(--line-strong); display: flex; align-items: center; gap: 8px; }
        .drawer-foot .meta { font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.18em; color: var(--faint); }
        .drawer-foot .meta i { color: #fff; margin-right: 6px; }

        /* ===== Header ===== */
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8, 8, 11, 0.85);
            border-bottom: 1px solid var(--line);
        }
        .header-inner {
            max-width: 1140px; margin: 0 auto;
            padding: 13px 26px;
            display: flex; align-items: center;
            justify-content: space-between; gap: 18px;
        }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
        .brand-icon {
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            background: #fff; color: #0a0a0d; font-size: 16px; flex-shrink: 0;
            box-shadow: 4px 4px 0 var(--hard);
        }
        .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.22rem; letter-spacing: 0.22em; white-space: nowrap; color: #fff; }
        .hud { font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.16em; color: var(--faint); display: flex; align-items: center; gap: 12px; white-space: nowrap; }
        .hud .hud-dot { width: 7px; height: 7px; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.8); animation: blink 1.6s steps(2) infinite; }
        .hud b { color: #fff; font-weight: 400; }

        /* ===== Main ===== */
        main { position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding: 34px 26px 54px; min-height: calc(100vh - 70px); }
        #content-container { margin-bottom: 40px; }

        /* ===== Homepage ===== */
        .hero {
            position: relative;
            text-align: center;
            max-width: 880px; margin: 0 auto 42px;
            padding: 76px 24px 46px;
            border: 1px solid var(--line-strong);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            box-shadow: 8px 8px 0 var(--hard);
            animation: fadeSlideUp 0.6s ease both;
            overflow: hidden;
        }
        .hero::before {
            content: 'SYS /// MECHANIC ONLINE';
            position: absolute; top: 10px; left: 12px;
            font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.16em; color: var(--faint);
        }
        .hero::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(0,0,0,0.16) 3px 4px); }
        .hero h1 {
            font-family: var(--font-display); font-weight: 700;
            font-size: clamp(2.4rem, 8vw, 5rem);
            letter-spacing: 0.08em; text-transform: uppercase;
            color: #fff; margin-bottom: 22px; position: relative;
            min-height: 1.25em; line-height: 1.08;
            white-space: nowrap;
        }
        .hero h1 .tw { display: inline-block; min-width: 0.4ch; }
        .hero h1 .twc {
            display: inline-block; width: 0.09em; height: 1.02em;
            background: #fff; margin-left: 8px; vertical-align: -0.14em;
            animation: cursorBlink 1s steps(1) infinite;
        }
        .hero h1::after {
            content: ''; display: block; height: 5px; width: 150px; margin: 20px auto 0;
            background: #fff;
        }
        @keyframes cursorBlink { 50% { opacity: 0; } }
        .hero .tagline { font-family: var(--font-mono); font-size: 0.9rem; color: var(--muted); max-width: 640px; margin: 0 auto; line-height: 1.7; }
        .hero .buttons { margin-top: 30px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

        .btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 13px 24px;
            border: 1px solid var(--line-strong);
            text-decoration: none; cursor: pointer;
            font-family: var(--font-display); font-size: 0.98rem; font-weight: 600;
            letter-spacing: 0.08em;
            transition: all 0.18s ease;
            -webkit-user-select: none; user-select: none;
            color: #fff; background: transparent;
        }
        .btn i { font-size: 1rem; }
        .btn-primary { background: #fff; color: #0a0a0d; border-color: #fff; box-shadow: 0 4px 0 var(--hard); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--hard); }
        .btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--hard); }
        .btn-ghost:hover { transform: translateY(-2px); border-color: #fff; color: #fff; box-shadow: 0 4px 0 var(--hard); }

        .section-card {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--line);
            border-left: 3px solid #fff;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03), 0 14px 44px rgba(0, 0, 0, 0.35);
            padding: 32px 34px;
            margin-bottom: 28px;
            animation: fadeSlideUp 0.6s ease both;
        }
        .section-card h2 {
            font-family: var(--font-display); font-size: 1.14rem; font-weight: 700;
            letter-spacing: 0.12em; text-transform: uppercase;
            margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
            color: #fff;
        }
        .section-card h2 i { color: #fff; font-size: 0.9rem; }
        .section-card p { color: var(--muted); font-size: 0.96rem; line-height: 1.8; }
        .suggest-actions { margin-top: 22px; display: flex; justify-content: center; }

        /* ===== Background picker ===== */
        .bg-options { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 4px; }
        .bg-option { border: 1px solid var(--line); padding: 10px; cursor: pointer; text-align: center; transition: all 0.2s ease; background: var(--panel2); }
        .bg-option:hover { transform: translateY(-3px); border-color: #fff; }
        .bg-option.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25); }
        .bg-swatch { width: 100%; height: 66px; margin-bottom: 8px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .bg-option .bg-name { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; }
        .bg-swatch.sw-deep { background: #0a0a0d; }
        .bg-swatch.sw-aurora { background: #0b0f14; }
        .bg-swatch.sw-flare { background: #140f0e; }
        .bg-swatch.sw-candy { background: #100f16; }
        .bg-swatch.sw-vortex { background: #0e0d1a; }
        .bg-swatch.sw-emerald { background: #0a0f0d; }

        .links-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-top: 6px; }
        .link-card {
            display: flex; align-items: center; gap: 16px;
            padding: 20px; border: 1px solid var(--line);
            background: var(--panel2);
            text-decoration: none; color: #fff;
            transition: all 0.2s ease;
        }
        .link-card .icon { width: 46px; height: 46px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #0a0a0d; background: #fff; box-shadow: 3px 3px 0 var(--hard); }
        .link-card .info h3 { font-family: var(--font-display); font-size: 1rem; letter-spacing: 0.1em; margin-bottom: 4px; }
        .link-card .info p { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
        .link-card:hover { transform: translateY(-4px); border-color: #fff; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4); }

        /* ===== Game iframe ===== */
        #Game {
            display: none; width: 100%; height: 78vh;
            border: 1px solid var(--line-strong);
            background: #000;
            box-shadow: 0 0 70px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease both; margin-bottom: 40px;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #gameBar {
            display: none;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 18px;
            z-index: 150;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 8px 12px;
            background: rgba(10, 10, 13, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
        }
        #gameBar .btn { padding: 9px 16px; font-size: 0.85rem; }
        #gameBar .btn-primary, #gameBar .btn-ghost { background: #fff; color: #0a0a0d; border-color: #fff; box-shadow: 0 3px 0 var(--hard); }
        #gameBar .btn-ghost:hover { background: #fff; color: #0a0a0d; transform: translateY(-2px); }

        /* ===== Spinner ===== */
        #spinner { display: none; position: fixed; inset: 0; z-index: 600; align-items: center; justify-content: center; background: rgba(8, 8, 11, 0.82); }
        .spinner-icon {
            width: 56px; height: 56px;
            border: 3px solid rgba(255, 255, 255, 0.14);
            border-top-color: #fff;
            border-right-color: #888;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== Gallery ===== */
        .gallery-head { text-align: center; margin-bottom: 30px; animation: fadeSlideUp 0.5s ease both; }
        .gallery-head h1 {
            font-family: var(--font-display); font-weight: 700;
            font-size: clamp(1.9rem, 4vw, 2.7rem);
            letter-spacing: 0.12em; text-transform: uppercase;
            color: #fff; margin-bottom: 10px;
        }
        .gallery-head h1::before, .gallery-head h1::after { color: var(--muted); font-size: 0.7em; vertical-align: 0.14em; }
        .gallery-head h1::before { content: '// '; }
        .gallery-head h1::after { content: ' //'; opacity: 0.4; }
        .gallery-head p { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.08em; color: var(--muted); }

        .gallery-tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; margin-bottom: 26px; }
        .gallery-tools input[type="text"] {
            padding: 11px 16px; border: 1px solid var(--line-strong);
            background: var(--panel); color: #fff;
            font-family: var(--font-mono); font-size: 0.9rem;
            width: 264px; outline: none; transition: all 0.2s ease;
        }
        .gallery-tools input[type="text"]:focus { border-color: #fff; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2); }
        .gallery-tools input[type="text"]::placeholder { color: var(--faint); }
        .gallery-tools select { padding: 11px 12px; border: 1px solid var(--line-strong); background: var(--panel); color: #fff; font-family: var(--font-mono); font-size: 0.9rem; outline: none; cursor: pointer; }
        .gallery-tools select option { background: var(--panel); color: #fff; }

        .count-badge {
            font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.1em;
            color: var(--muted);
            background: var(--panel); border: 1px dashed var(--line-strong);
            padding: 9px 14px;
        }
        .count-badge::before { content: '['; color: #fff; }
        .count-badge::after { content: ']'; color: #fff; }

        /* ===== Category chips ===== */
        .cat-chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 26px; }
        .chip {
            padding: 8px 15px; border: 1px solid var(--line-strong);
            background: rgba(255, 255, 255, 0.02);
            color: var(--muted);
            font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s ease;
        }
        .chip:hover { color: #fff; border-color: #fff; transform: translateY(-2px); }
        .chip.active { color: #0a0a0d; border-color: #fff; background: #fff; box-shadow: 0 3px 0 var(--hard); }

        /* ===== Pagination ===== */
        .pagination { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; align-items: center; }
        .page-btn {
            min-width: 40px; height: 40px; padding: 0 12px;
            border: 1px solid var(--line-strong);
            background: var(--panel); color: var(--muted);
            font-family: var(--font-mono); font-size: 0.85rem;
            cursor: pointer; transition: all 0.2s ease;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .page-btn:hover { color: #fff; border-color: #fff; transform: translateY(-2px); }
        .page-btn.active { color: #0a0a0d; background: #fff; border-color: #fff; box-shadow: 0 3px 0 var(--hard); }
        .page-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
        .page-ellipsis { opacity: 0.5; cursor: default; pointer-events: none; }
        .pagination .page-size { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-family: var(--font-mono); font-size: 0.72rem; background: var(--panel); border: 1px solid var(--line); padding: 5px 12px; }
        .pagination .page-size select { padding: 5px 8px; border: 1px solid var(--line-strong); background: var(--panel2); color: #fff; font-family: var(--font-mono); font-size: 0.8rem; cursor: pointer; }
        .pagination .page-size select option { background: var(--panel2); }
        .pagination .page-nav { display: inline-flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .pagination .page-jump { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-family: var(--font-mono); font-size: 0.72rem; background: var(--panel); border: 1px solid var(--line); padding: 5px 12px; }
        .pagination .page-jump i { color: #fff; }
        .pagination .page-jump input[type="number"] { width: 64px; padding: 5px 8px; border: 1px solid var(--line-strong); background: var(--panel2); color: #fff; font-family: var(--font-mono); font-size: 0.8rem; text-align: center; -moz-appearance: textfield; appearance: textfield; }
        .pagination .page-jump input[type="number"]::-webkit-outer-spin-button,
        .pagination .page-jump input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .pagination .jump-total { color: var(--faint); min-width: 34px; }
        .page-go { min-width: 36px; height: 32px; padding: 0 10px; font-size: 0.8rem; }

        /* ===== Game grid / cards ===== */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 18px; counter-reset: card; }
        .game-card {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            background: var(--panel);
            cursor: pointer;
            display: flex; flex-direction: column;
            counter-increment: card;
            transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.28s ease, box-shadow 0.28s ease;
            animation: fadeSlideUp 0.4s ease both;
        }
        .game-card::after {
            content: counter(card, decimal-leading-zero);
            position: absolute; top: 8px; left: 8px; z-index: 3;
            font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em;
            color: #0a0a0d; background: #fff;
            padding: 2px 6px; box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.45);
        }
        .game-card .thumb { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; transition: transform 0.4s ease; background: var(--panel2); }
        .game-card .thumb-ph {
            width: 100%; aspect-ratio: 16/10;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.08), transparent 60%), #15151c;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }
        .game-card .thumb-ph .initials {
            font-family: var(--font-display); font-weight: 700;
            font-size: 1.9rem; letter-spacing: 0.06em;
            color: #fff;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease;
        }
        .game-card:hover { transform: translateY(-5px); border-color: #fff; box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.25); }
        .game-card:hover .thumb { transform: scale(1.06); }
        .game-card:hover .thumb-ph .initials { transform: scale(1.12) rotate(-3deg); }
        .game-card .card-body { padding: 13px 14px 6px; flex: 1; }
        .game-card .card-body h3 { font-family: var(--font-display); font-size: 0.98rem; font-weight: 600; line-height: 1.3; margin-bottom: 5px; color: #fff; letter-spacing: 0.02em; }
        .game-card .card-body .cats { font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
        .game-card .play-btn {
            margin: 10px 14px 14px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px; border: none;
            background: #fff; color: #0a0a0d;
            font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
            letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 3px 0 var(--hard);
            transition: all 0.15s ease;
        }
        .game-card .play-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--hard); }
        .game-card .play-btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--hard); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); font-family: var(--font-mono); font-size: 0.9rem; }
        .empty-state i { display: block; font-size: 2.6rem; margin-bottom: 14px; color: #fff; }

        .back-bar { margin-top: 30px; text-align: center; }

        /* ===== Beta notice ===== */
        .beta-notice { border-left: 3px solid #fff; }

        /* ===== Generic settings/form overrides ===== */
        .settings-panel, .settings-card, .panel { background: var(--panel) !important; border: 1px solid var(--line) !important; color: #fff !important; }
        label, .label, .setting-label { color: var(--muted) !important; font-family: var(--font-mono) !important; font-size: 0.72rem !important; letter-spacing: 0.1em !important; text-transform: uppercase !important; }
        input[type="text"], input[type="url"], input[type="color"], input[type="number"], select, textarea {
            background: var(--panel2) !important; color: #fff !important;
            border: 1px solid var(--line-strong) !important;
            font-family: var(--font-mono) !important;
        }

        /* ===== Footer ===== */
        footer {
            position: relative; z-index: 1;
            text-align: center; padding: 24px;
            color: var(--faint);
            font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase;
            border-top: 1px dashed var(--line-strong);
            background: rgba(8, 8, 11, 0.6);
        }
        footer span { color: #fff; }

        /* ===== Movie mode: fullscreen-fill the page, only the left nav stays ===== */
        body.movie-mode main { max-width: none; margin: 0; padding: 0; min-height: 0; }
        body.movie-mode header, body.movie-mode footer, body.movie-mode #content-container, body.movie-mode #gameBar { display: none !important; }
        body.movie-mode #Game {
            position: fixed; inset: 0;
            width: 100vw; height: 100vh;

            z-index: 50; background: #000;
        }

        @media (max-width: 720px) {

            .section-card { padding: 24px 20px; }
            .hero { padding: 60px 18px 40px; }
            .hero h1 { white-space: normal; }
        }

        // ===== Left edge nav drawer (pure slide; no button) =====
        (function() {
            var drawer = document.getElementById('sideDrawer');
            if (drawer) {
                drawer.addEventListener('click', function(e) {
                    if (e.target.closest('a')) drawer.classList.remove('open');
                });
            }
            // touch / tap near the left edge also opens the drawer
            document.addEventListener('pointerdown', function(e) {
                if (e.clientX <= 30 && drawer) drawer.classList.add('open');
            });
            function pad(n) { return (n < 10 ? '0' : '') + n; }
            function tick() {
                var d = new Date();
                var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
                var hms = hm + ':' + pad(d.getSeconds());
                var hc = document.getElementById('headerClock');
                var dc = document.getElementById('drawerClock');
                if (hc) hc.textContent = hms;
                if (dc) dc.textContent = hm;
            }
            tick();
            setInterval(tick, 1000);
        })();

        // ===== Interactive "spider web" background =====
        (function() {
            var cv = document.getElementById('webBkg');
            if (!cv) return;
            var ctx = cv.getContext('2d');
            if (!ctx) return;
            var DPR = Math.min(window.devicePixelRatio || 1, 2);
            var W = 0, H = 0, nodes = [], N = 64;
            var mouse = { x: -9999, y: -9999, active: false };
            function seed() {
                nodes.length = 0;
                for (var i = 0; i < N; i++) {
                    nodes.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        vx: (Math.random() - 0.5) * 0.25,
                        vy: (Math.random() - 0.5) * 0.25,
                        r: Math.random() * 1.6 + 0.6
                    });
                }
            }
            function resize() {
                W = window.innerWidth;
                H = window.innerHeight;
                cv.width = Math.round(W * DPR);
                cv.height = Math.round(H * DPR);
                cv.style.width = W + 'px';
                cv.style.height = H + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                seed();
            }
            function step() {
                ctx.clearRect(0, 0, W, H);
                var i, j, a, dx, dy, d, t;
                for (i = 0; i < nodes.length; i++) {
                    a = nodes[i];
                    a.x += a.vx; a.y += a.vy;
                    if (a.x <= 0) { a.x = 0; a.vx = Math.abs(a.vx); }
                    if (a.x >= W) { a.x = W; a.vx = -Math.abs(a.vx); }
                    if (a.y <= 0) { a.y = 0; a.vy = Math.abs(a.vy); }
                    if (a.y >= H) { a.y = H; a.vy = -Math.abs(a.vy); }
                }
                ctx.lineWidth = 1;
                for (i = 0; i < nodes.length; i++) {
                    for (j = i + 1; j < nodes.length; j++) {
                        dx = nodes[i].x - nodes[j].x;
                        dy = nodes[i].y - nodes[j].y;
                        d = dx * dx + dy * dy;
                        if (d < 130 * 130) {
                            t = 1 - Math.sqrt(d) / 130;
                            ctx.strokeStyle = 'rgba(255,255,255,' + (t * 0.12).toFixed(3) + ')';
                            ctx.beginPath();
                            ctx.moveTo(nodes[i].x, nodes[i].y);
                            ctx.lineTo(nodes[j].x, nodes[j].y);
                            ctx.stroke();
                        }
                    }
                }
                if (mouse.active) {
                    for (i = 0; i < nodes.length; i++) {
                        dx = nodes[i].x - mouse.x;
                        dy = nodes[i].y - mouse.y;
                        d = dx * dx + dy * dy;
                        if (d < 220 * 220) {
                            t = 1 - Math.sqrt(d) / 220;
                            ctx.strokeStyle = 'rgba(255,255,255,' + (t * 0.35).toFixed(3) + ')';
                            ctx.beginPath();
                            ctx.moveTo(nodes[i].x, nodes[i].y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.stroke();
                        }
                    }
                    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    ctx.beginPath();
                    ctx.arc(mouse.x, mouse.y, 3, 0, 6.2832);
                    ctx.stroke();
                }
                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                for (i = 0; i < nodes.length; i++) {
                    a = nodes[i];
                    ctx.fillRect(a.x - a.r / 2, a.y - a.r / 2, a.r, a.r);
                }
                requestAnimationFrame(step);
            }
            window.addEventListener('resize', resize);
            window.addEventListener('pointermove', function(e) {
                mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
            });
            window.addEventListener('pointerleave', function() { mouse.active = false; });
            document.addEventListener('mouseleave', function() { mouse.active = false; });
            resize();
            requestAnimationFrame(step);
        })();

        // ===== MECHANIC typewriter title =====
        var _twStop = null;
        function startTypewriter() {
            if (_twStop) { _twStop(); _twStop = null; }
            var el = document.getElementById('typewriter');
            if (!el) return;
            var words = ['MECHANIC', 'PLAY', 'CREATE', 'IMAGINE'];
            var w = 0, i = 0, del = false, stopped = false, timer;
            _twStop = function() { stopped = true; clearTimeout(timer); };
            function step() {
                if (stopped) return;
                var word = words[w];
                if (!del) {
                    i++;
                    el.textContent = word.slice(0, i);
                    if (i === word.length) { del = true; timer = setTimeout(step, 1500); }
                    else timer = setTimeout(step, 70);
                } else {
                    if (i === 0) {
                        w = (w + 1) % words.length;
                        del = false;
                        timer = setTimeout(step, 380);
                    } else {
                        i--;
                        el.textContent = word.slice(0, i);
                        timer = setTimeout(step, 45);
                    }
                }
            }
            step();

        function galleryJsonUrl(type) {
            return type === 'apps'
                ? 'https://cdn.jsdelivr.net/npm/@arcade-v/arcade_v/navigation/games/apps.json'
                : 'https://cdn.jsdelivr.net/npm/@arcade-v/arcade_v/navigation/games/games.json';
        }

        function showGallery(type) {
            document.body.classList.remove('movie-mode');
            galleryType = type;
            const container = document.getElementById('content-container');
            container.style.display = 'block';
            container.innerHTML =
                '<div class="gallery-head"><h1>' + (type === 'apps' ? 'Apps' : 'Games') + '</h1>' +
                '<p>Browse all the ' + (type === 'apps' ? 'apps' : 'games') + ' — click a card to play!</p></div>' +
                (type === 'apps' ? '' : '<div class="beta-notice" style="margin:10px 0 14px;padding:10px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.25);font-size:14px;color:#cfcfd8;line-height:1.5;">' +
                '<i class="fas fa-flask"></i> <strong>Beta site:</strong> not all games are guaranteed to work. This is a work-in-progress version, so some titles may fail to load or display a black screen.</div>') +
                '<div class="gallery-tools" id="galleryTools">' +
                '<input type="text" id="gSearch" placeholder="Search ' + (type === 'apps' ? 'apps' : 'games') + '..." oninput="onSearch()">' +
                '<span class="count-badge" id="gCount"></span>' +
                '</div>' +
                '<div class="cat-chips" id="chipBar"></div>' +
                '<div class="game-grid" id="gameGrid"><div class="empty-state"><i class="fas fa-wrench"></i> Loading...</div></div>' +
                '<div class="pagination" id="pagination"></div>' +
                '<div class="back-bar"><button class="btn btn-ghost" onclick="showHome();"><i class="fas fa-arrow-left"></i> Back to Home</button></div>';
            restartAnimation(container);
            setActive(type === 'apps' ? 'apps' : 'games');

            const frame = document.getElementById('Game');
            frame.src = 'about:blank';
            frame.style.display = 'none';
            document.getElementById('gameBar').style.display = 'none';

            currentCategory = 'All';
            loadPageContent(galleryJsonUrl(type), function(text) {
                try {
                    galleryData = JSON.parse(text);
                } catch (e) {
                    galleryData = [];
                }
                // Remove the "Request a Feature" entry (it's in both feeds).
                if (Array.isArray(galleryData)) {
                    galleryData = galleryData.filter(function(g) {
                        return !/request a feature/i.test((g.title || '').trim());
                    });
                }
                // Merge the gn-math collection into the Games tab (not Apps).
                if (type === 'games' && Array.isArray(galleryData)) {
                    // Convert arcade entries to a normalized shape and dedupe by title
                    const existing = {};
                    galleryData.forEach(function(g) {
                        existing[(g.title || '').toLowerCase().trim()] = true;
                    });
                    GN_CATALOG.concat(UGS_CATALOG || []).forEach(function(g) {
                        const key = g.title.toLowerCase().trim();
                        if (!existing[key]) {
                            galleryData.push(g);
                            existing[key] = true;
                        }
                    });
                }
                // Add the custom BlooketBot app to the Apps tab (loaded as a direct iframe).
                if (type === 'apps' && Array.isArray(galleryData)) {
                    galleryData.unshift({
                        title: 'Geoforce',
                        url: 'https://learningaboutnoahandjacobatwork.b-cdn.net/api?url=https://tinyurl.com/ys54n4xe/&type=prism&autoSW=false',
                        category: ['Tools'],
                        direct: true,
                        newTab: true

                        url: 'https://learningaboutnoahandjacobatwork.b-cdn.net/api?url=https://bit.ly/4zeebWi',
                        category: ['Tools'],
                        direct: true
                    });

                buildChips();
                renderGallery();
            });

        let currentCategory = 'All';

        function normalizeCat(c) {
            return String(c).trim().toLowerCase() === 'multi player' ? 'Multiplayer' : c;
        }

        function buildChips() {
            const set = {};
            galleryData.forEach(function(g) {
                (g.category || []).forEach(function(c) { set[normalizeCat(c)] = true; });
            });
            const cats = Object.keys(set).sort();
            let html = '<button class="chip active" onclick="setCategory(\'All\')">All</button>';
            cats.forEach(function(c) {
                html += '<button class="chip" onclick="setCategory(\'' + c.replace(/'/g, "\\'") + '\')">' + c + '</button>';
            });
            document.getElementById('chipBar').innerHTML = html;
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('#chipBar .chip').forEach(function(chip) {
                chip.classList.toggle('active', chip.textContent === cat);
            });
            currentPage = 1;
            renderGallery();
        }

        function onSearch() {
            currentPage = 1;

        let PER_PAGE = 12;
        let currentPage = 1;

        function renderGallery() {
            const q = (document.getElementById('gSearch').value || '').toLowerCase().trim();

            const filtered = galleryData.filter(function(g) {
                const matchesQ = !q || (g.title || '').toLowerCase().includes(q);
                const matchesCat = currentCategory === 'All' ||
                    (g.category || []).some(function(c) { return normalizeCat(c) === currentCategory; });
                return matchesQ && matchesCat;
            });

            const count = document.getElementById('gCount');
            count.textContent = filtered.length + ' found';

            const grid = document.getElementById('gameGrid');
            const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * PER_PAGE;
            const pageItems = filtered.slice(start, start + PER_PAGE);

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-satellite-dish"></i> Nothing found.</div>';
                renderPagination(totalPages);

            let html = '';

                const title = (g.title || 'Untitled').toString();
                const safeTitle = title.replace(/"/g, '&quot;');
                const img = g.image || g.logo || '';
                const catCount = (g.category || []).length;
                const cats = (g.category || []).slice(0, 3).join(', ') + (catCount > 3 ? ' +' + (catCount - 3) : '');
                const initials = (title.replace(/[^a-zA-Z0-9 ]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map(function(w){ return w[0]; }).join('')).toUpperCase() || '?';
                const thumb = img
                    ? '<img class="thumb" src="' + img + '" alt="' + safeTitle + '" loading="lazy" onerror="this.onerror=null;this.style.display=\'none\';var _d=document.createElement(\'div\');_d.className=\'thumb thumb-ph\';_d.style.aspectRatio=\'16/10\';_d.innerHTML=\'<span class=&quot;initials&quot;>' + initials + '</span>\';this.insertAdjacentElement(\'afterend\',_d);">'
                    : '<div class="thumb thumb-ph"><span class="initials">' + initials + '</span></div>';
                html +=
                    '<div class="game-card" style="animation-delay:' + (i % 12) * 0.02 + 's">' +
                    thumb +
                    '<div class="card-body"><h3>' + safeTitle + '</h3><div class="cats">' + cats + '</div></div>' +
                    '<button class="play-btn" data-url="' + g.url + '"' + (g.direct ? ' data-direct="1"' : '') + (g.newTab ? ' data-newtab="1"' : '') + ' onmouseover="prewarmGame(\'' + (g.url || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\')" onclick="playGame(this)"><i class="fas fa-play"></i> Launch</button>' +
                    '</div>';
            });
            grid.innerHTML = html;

            renderPagination(totalPages);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination(totalPages) {
            const p = document.getElementById('pagination');
            if (totalPages <= 1) {
                p.innerHTML = '';
                return;
            }
            const cp = currentPage;

            let html = '<div class="page-size">Show ' +
                '<select onchange="setPageSize(this.value)">' +
                '<option value="12"' + (PER_PAGE === 12 ? ' selected' : '') + '>12</option>' +
                '<option value="24"' + (PER_PAGE === 24 ? ' selected' : '') + '>24</option>' +
                '<option value="48"' + (PER_PAGE === 48 ? ' selected' : '') + '>48</option>' +
                '<option value="96"' + (PER_PAGE === 96 ? ' selected' : '') + '>96</option>' +
                '</select> per page</div>';

            html += '<span class="page-nav">';
            html += '<button class="page-btn" onclick="goToPage(1)" ' + (cp === 1 ? 'disabled' : '') + ' title="First"><i class="fas fa-angle-double-left"></i></button>';
            html += '<button class="page-btn" onclick="goToPage(' + (cp - 1) + ')" ' + (cp === 1 ? 'disabled' : '') + ' title="Previous"><i class="fas fa-chevron-left"></i></button>';

            // Windowed page numbers with ellipsis
            const win = 2;
            const pages = [];
            for (var i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= cp - win && i <= cp + win)) pages.push(i);
            }
            let prev = 0;
            pages.forEach(function(pi) {
                if (prev && pi - prev > 1) {
                    html += '<button class="page-btn page-ellipsis" disabled>…</button>';
                }
                html += '<button class="page-btn' + (pi === cp ? ' active' : '') + '" onclick="goToPage(' + pi + ')">' + pi + '</button>';
                prev = pi;
            });

            html += '<button class="page-btn" onclick="goToPage(' + (cp + 1) + ')" ' + (cp === totalPages ? 'disabled' : '') + ' title="Next"><i class="fas fa-chevron-right"></i></button>';
            html += '<button class="page-btn" onclick="goToPage(' + totalPages + ')" ' + (cp === totalPages ? 'disabled' : '') + ' title="Last"><i class="fas fa-angle-double-right"></i></button>';
            html += '</span>';

            // Jump-to-page box
            html += '<span class="page-jump"><i class="fas fa-forward"></i> Jump to ' +
                '<input type="number" id="jumpInput" min="1" max="' + totalPages + '" value="' + cp + '" onkeydown="if(event.key===\'Enter\')jumpToPage(this.value);"> ' +
                '<span class="jump-total">/ ' + totalPages + '</span>' +
                '<button class="page-btn page-go" onclick="jumpToPage(document.getElementById(\'jumpInput\').value)">Go</button></span>';

            p.innerHTML = html;
        }

        function goToPage(page) {
            const totalPages = Math.max(1, Math.ceil(currentFilteredLength() / PER_PAGE));
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            currentPage = page;
            renderGallery();
        }

        function jumpToPage(val) {
            const page = parseInt(val, 10);
            const totalPages = Math.max(1, Math.ceil(currentFilteredLength() / PER_PAGE));
            goToPage(isNaN(page) ? 1 : page);
        }

        function setPageSize(val) {
            PER_PAGE = parseInt(val, 10) || 12;
            currentPage = 1;
            renderGallery();
        }

        function currentFilteredLength() {
            const q = (document.getElementById('gSearch').value || '').toLowerCase().trim();
            return galleryData.filter(function(g) {
                const matchesQ = !q || (g.title || '').toLowerCase().includes(q);
                const matchesCat = currentCategory === 'All' ||
                    (g.category || []).some(function(c) { return normalizeCat(c) === currentCategory; });
                return matchesQ && matchesCat;
            }).length;
        }

        // Preload / CDN warm-up: on hover (or click) over a game, preconnect to the
        // asset CDN and warm the game shell so the iframe gets everything faster.
        const _PRECONNECTED = {};
        function _preconnect(origin) {
            if (!origin || _PRECONNECTED[origin]) return;
            _PRECONNECTED[origin] = true;
            const dns = document.createElement('link');
            dns.rel = 'dns-prefetch';
            dns.href = origin;
            document.head.appendChild(dns);
            const pre = document.createElement('link');
            pre.rel = 'preconnect';
            pre.href = origin;
            pre.crossOrigin = 'anonymous';
            document.head.appendChild(pre);
        }
        function _originOf(u) {
            try {
                const a = new URL(u, window.location.href);
                return a.origin;
            } catch (e) {
                return u.split('/').slice(0, 3).join('/');
            }
        }
        function prewarmGame(rawUrl) {
            if (!rawUrl) return;
            _preconnect(_originOf(rawUrl));
            // UGS shells pull heavy assets from jsDelivr - always warm that origin too.
            _preconnect('https://cdn.jsdelivr.net');
            // Warm the shell file so the iframe request hits the browser cache.
            try {
                fetch(rawUrl, { mode: 'no-cors', cache: 'default' }).catch(function() {});
            } catch (e) {}
        }
        // Called on click: prefetch the heavy Unity build assets in the background
        // (at idle priority) so the iframe doesn't stall waiting on the ~60MB download.
        function prewarmGameAssets(rawUrl) {
            if (!rawUrl || rawUrl.indexOf('cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/') !== 0) return;
            fetch(rawUrl)
                .then(function(r) { return r.text(); })
                .then(function(html) {
                    // Extract the asset <base> so we can warm the same origin the game uses.
                    const m = html.match(/<base\s+[^>]*href\s*=\s*["']([^"']+)["']/);
                    if (!m) return;
                    const base = m[1].replace(/[?#].*$/, '');
                    _preconnect(_originOf(base));
                    const enqueue = function(cb) {
                        if (typeof window.requestIdleCallback === 'function') {
                            window.requestIdleCallback(cb);
                        } else {
                            setTimeout(cb, 200);
                        }
                    };
                    // Warm the Unity loader and zipped build parts at low priority.
                    enqueue(function() {
                        ['Build/Build.loader.js', 'Build/Build.data.zip', 'Build/Build.wasm.zip']
                            .forEach(function(rel) {
                                try {
                                    fetch(base.replace(/\/$/, '') + '/' + rel, { mode: 'no-cors', cache: 'default' }).catch(function() {});
                                } catch (e) {}
                            });
                    });
                })
                .catch(function() {});
        }
        // Warm frequently used sources on load.
        (function prewarmOnLoad() {
            _preconnect('https://cdn.jsdelivr.net');
            _preconnect('https://thisissonobodyplaysgame.github.io');
            _preconnect('https://raw.githubusercontent.com');
        })();

        function playGame(btn) {
            let url = btn.getAttribute('data-url');
            if (!url) return;
            // Preload futher as soon as the game is clicked (before iframe mounts).
            prewarmGame(url);
            // raw.githubusercontent.com blocks iframes (X-Frame-Options: deny) and
            // Unity/HTML5 games fail when blob-loaded. rawcdn.githack mirrors the
            // same GitHub file but allows embedding, so serve it as a direct iframe
            // where the game runs in its native origin (fixes black screens).
            const RAWGH = 'https://raw.githubusercontent.com/';
            if (url.indexOf(RAWGH) === 0 && /\.html?$/i.test(url.split(/[?#]/)[0])) {
                // Serve gn (gn-math/html) games from our own GitHub Pages mirror
                // instead of rawcdn.githack, which Securly blocks. raw.githubusercontent.com/gn-math/html/main/X
                // becomes https://thisissonobodyplaysgame.github.io/ugs/GN-Files/X
                url = 'https://thisissonobodyplaysgame.github.io/ugs/GN-Files/' +
                    url.slice(RAWGH.length).split('/').slice(3).join('/');
                setIframe(url);
                return;
            }
            // UGS games: jsDelivr serves these as text/plain (cannot direct-iframe),
            // so serve them as direct iframes from our GitHub Pages mirror instead.
            const UGSJSD = 'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/';
            if (url.indexOf(UGSJSD) === 0) {
                // Kick off background prefetch of the heavy build assets (loader/data/wasm)
                // in parallel with the iframe mounting, so the big download starts sooner.
                prewarmGameAssets(url);
                url = 'https://thisissonobodyplaysgame.github.io/ugs/UGS-Files/' + url.slice(UGSJSD.length);
                setIframe(url);
                return;
            }
            if (btn.getAttribute('data-newtab')) {
                window.open(url, '_blank', 'noopener');
                return;
            }
            if (btn.getAttribute('data-direct')) {
                setIframe(url);
            } else {
                launchGame(url);
            }
        }

        // Launch a game. Most game URLs block direct iframe embedding,
        // so we fetch the HTML and load it via a blob URL.
        function launchGame(url) {
            loadPageContent(url, function(content) {
                var html = content;
                // Inject a <base> tag so relative asset paths resolve against the
                // real game URL. Games without their own <base> (many Unity/HTML5
                // games) otherwise lose relative paths when blob-loaded -> black screen.
                if (!/<base\s/i.test(html)) {
                    var baseDir = url.split('#')[0].split('?')[0];
                    if (!/\/$/.test(baseDir)) {
                        var slash = baseDir.lastIndexOf('/');
                        if (slash > 7) baseDir = baseDir.slice(0, slash + 1);
                    }
                    var baseTag = '<base href="' + baseDir + '">';
                    if (/<head[^>]*>/i.test(html)) {
                        html = html.replace(/<head[^>]*>/i, function(match) { return match + baseTag; });
                    } else {
                        html = baseTag + html;
                    }
                }
                var blob = new Blob([html], {type: 'text/html'});
                var iframe = document.getElementById('Game');
                iframe.src = URL.createObjectURL(blob);
                document.getElementById('content-container').style.display = 'none';
                iframe.style.display = 'block';
                document.getElementById('gameBar').style.display = 'flex';
                window.scrollTo(0, 0);
            });
        }

                        'background:rgba(168,85,247,0.1); color:#fff;' +

                    const parent = cloak.parentNode;
                    parent.insertBefore(cloakWrap, cloak);

                // Build and prepend the Background theme picker
                const bgSection = document.createElement('div');

        // Load blob content into the iframe
        function loadBlobContent(url) {

        // Fetch page content with a loading spinner
        function loadPageContent(url, callback) {
            const xhttp = new XMLHttpRequest();
            document.getElementById('spinner').style.display = 'flex';
            const urlWithNoCache = url + (url.includes('?') ? '&' : '?') + 'nocache=' + new Date().getTime();
            xhttp.onreadystatechange = function() {
                if (this.readyState === 4) {
                    document.getElementById('spinner').style.display = 'none';
                    if (this.status === 200) {
                        callback(this.responseText);
                    } else {
                        console.error('Failed to load:', url);
                    }
                }
            };
            xhttp.open('GET', urlWithNoCache, true);
            xhttp.send();
        }

        // Trigger fullscreen on the whole document so the background, stars,
        // and navbar all stay visible and navigation keeps working while fullscreen.
        function triggerFullscreen() {
            const docEl = document.documentElement;
            const req = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
            if (req) req.call(docEl);
        }

        // Fullscreen just the game/app iframe that's currently open.
        function triggerGameFullscreen() {
            const iframe = document.getElementById('Game');
            if (!iframe) return;
            const req = iframe.requestFullscreen || iframe.mozRequestFullScreen || iframe.webkitRequestFullscreen || iframe.msRequestFullscreen;
            if (req) req.call(iframe);
        }
